# You can override the included template(s) by including variable overrides
# SAST customization: https://docs.gitlab.com/ee/user/application_security/sast/#customizing-the-sast-settings
# Secret Detection customization: https://docs.gitlab.com/user/application_security/secret_detection/pipeline/configure
# Dependency Scanning customization: https://docs.gitlab.com/ee/user/application_security/dependency_scanning/#customizing-the-dependency-scanning-settings
# Container Scanning customization: https://docs.gitlab.com/ee/user/application_security/container_scanning/#customizing-the-container-scanning-settings
# Note that environment variables can be set in several places
# See https://docs.gitlab.com/ee/ci/variables/#cicd-variable-precedence

stages:
  - lint
  - plan
  - apply

variables:
  TF_IN_AUTOMATION: "true"
  TF_INPUT: "false"
  TF_CLI_ARGS: "-no-color"
  AWS_DEFAULT_REGION: "ap-northeast-2"

default:
  tags:
    - terraform

workflow:
  rules:
    - if: '$CI_COMMIT_BRANCH'
    - when: never

.assume_oidc: &assume_oidc
  - |
    echo "oidc debug: job=${CI_JOB_NAME:-unknown} env=${TF_ENV:-unknown} branch=${CI_COMMIT_REF_NAME:-unknown}"
    echo "oidc debug: AWS_ROLE_ARN=${AWS_ROLE_ARN:-<empty>}"

    if [ -z "${AWS_ROLE_ARN:-}" ]; then
      echo "ERROR: AWS_ROLE_ARN is empty."
      echo "Check CI/CD variable injection (protected/scope/masked) for role ARN variables."
      echo "TF_PLAN_ROLE_ARN_SHARED=${TF_PLAN_ROLE_ARN_SHARED:-<empty>}"
      echo "TF_PLAN_ROLE_ARN_DEV=${TF_PLAN_ROLE_ARN_DEV:-<empty>}"
      echo "TF_PLAN_ROLE_ARN_PROD=${TF_PLAN_ROLE_ARN_PROD:-<empty>}"
      echo "TF_APPLY_ROLE_ARN_SHARED=${TF_APPLY_ROLE_ARN_SHARED:-<empty>}"
      echo "TF_APPLY_ROLE_ARN_DEV=${TF_APPLY_ROLE_ARN_DEV:-<empty>}"
      echo "TF_APPLY_ROLE_ARN_PROD=${TF_APPLY_ROLE_ARN_PROD:-<empty>}"
      exit 1
    fi

    case "${AWS_ROLE_ARN}" in
      '$'* | '${'*)
        echo "ERROR: AWS_ROLE_ARN looks unresolved: ${AWS_ROLE_ARN}"
        echo "Expected a concrete ARN like arn:aws:iam::<account-id>:role/<role-name>"
        exit 1
        ;;
    esac

    if [ -z "${GITLAB_OIDC_TOKEN:-}" ]; then
      echo "ERROR: GITLAB_OIDC_TOKEN is empty. Check id_tokens configuration."
      exit 1
    fi
    echo "${GITLAB_OIDC_TOKEN}" | cut -d. -f2 | base64 -d 2>/dev/null | jq -r '"oidc iss=\(.iss) aud=\(.aud) sub=\(.sub)"'

    echo "Starting AWS STS AssumeRole..."
    set +e
    aws sts assume-role-with-web-identity \
      --role-arn "${AWS_ROLE_ARN}" \
      --role-session-name "gitlab-debug-$(date +%s)" \
      --web-identity-token "${GITLAB_OIDC_TOKEN}" \
      --duration-seconds 3600 \
      --region ap-northeast-2 \
      --output json > /tmp/sts_creds.json 2>&1
    STS_EXIT=$?
    set -e

    if [ "${STS_EXIT}" -ne 0 ]; then
      echo "ERROR: AWS STS AssumeRole failed."
      cat /tmp/sts_creds.json
      rm -f /tmp/sts_creds.json
      exit "${STS_EXIT}"
    fi

    export AWS_ACCESS_KEY_ID=$(jq -r '.Credentials.AccessKeyId' /tmp/sts_creds.json)
    export AWS_SECRET_ACCESS_KEY=$(jq -r '.Credentials.SecretAccessKey' /tmp/sts_creds.json)
    export AWS_SESSION_TOKEN=$(jq -r '.Credentials.SessionToken' /tmp/sts_creds.json)
    rm -f /tmp/sts_creds.json
    aws sts get-caller-identity

fmt:
  stage: lint
  script:
    - terraform version
    - terraform fmt -check -recursive
  rules:
    - if: '$CI_COMMIT_BRANCH'

validate:
  stage: lint
  script:
    - |
      for d in envs/shared envs/dev envs/prod; do
        echo "== validate: $d =="
        terraform -chdir="$d" init -backend=false
        terraform -chdir="$d" validate
      done
  rules:
    - if: '$CI_COMMIT_BRANCH'

.plan_template:
  stage: plan
  id_tokens:
    GITLAB_OIDC_TOKEN:
      aud: https://gitlab.tamacoach.net
  before_script:
    - *assume_oidc
  script:
    - test -f "envs/${TF_ENV}/terraform.tfvars" || (echo "missing envs/${TF_ENV}/terraform.tfvars"; exit 1)
    - terraform -chdir="envs/${TF_ENV}" init -reconfigure -backend-config="backend.hcl"
    - terraform -chdir="envs/${TF_ENV}" plan -var-file="terraform.tfvars" -out="tfplan"
  artifacts:
    paths:
      - "envs/${TF_ENV}/tfplan"
    expire_in: 1 day

plan:shared:
  extends: .plan_template
  variables:
    TF_ENV: "shared"
    AWS_ROLE_ARN: "${TF_PLAN_ROLE_ARN_SHARED}"
  rules:
    - if: '$CI_COMMIT_BRANCH == "develop" || $CI_COMMIT_BRANCH == "main"'
      changes:
        - envs/shared/**/*

plan:dev:
  extends: .plan_template
  variables:
    TF_ENV: "dev"
    AWS_ROLE_ARN: "${TF_PLAN_ROLE_ARN_DEV}"
  rules:
    - if: '$CI_COMMIT_BRANCH == "develop"'
      changes:
        - envs/dev/**/*

plan:prod:
  extends: .plan_template
  variables:
    TF_ENV: "prod"
    AWS_ROLE_ARN: "${TF_PLAN_ROLE_ARN_PROD}"
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'
      changes:
        - envs/prod/**/*

.apply_template:
  stage: apply
  when: manual
  allow_failure: false
  id_tokens:
    GITLAB_OIDC_TOKEN:
      aud: https://gitlab.tamacoach.net
  before_script:
    - *assume_oidc
  script:
    - test -f "envs/${TF_ENV}/terraform.tfvars" || (echo "missing envs/${TF_ENV}/terraform.tfvars"; exit 1)
    - terraform -chdir="envs/${TF_ENV}" init -reconfigure -backend-config="backend.hcl"
    - terraform -chdir="envs/${TF_ENV}" show -no-color tfplan | sed -n '1,200p'
    - terraform -chdir="envs/${TF_ENV}" apply -var-file="terraform.tfvars" -auto-approve tfplan
  rules:
    - when: never

apply:shared:
  extends: .apply_template
  variables:
    TF_ENV: "shared"
    AWS_ROLE_ARN: "${TF_APPLY_ROLE_ARN_SHARED}"
  needs:
    - job: plan:shared
      artifacts: true
  rules:
    - if: '$CI_COMMIT_BRANCH == "develop" || $CI_COMMIT_BRANCH == "main"'
      changes:
        - envs/shared/**/*
      when: manual
    - when: never

apply:dev:
  extends: .apply_template
  variables:
    TF_ENV: "dev"
    AWS_ROLE_ARN: "${TF_APPLY_ROLE_ARN_DEV}"
  needs:
    - job: apply:shared
      optional: true
    - job: plan:dev
      artifacts: true
  rules:
    - if: '$CI_COMMIT_BRANCH == "develop"'
      changes:
        - envs/dev/**/*
      when: manual
    - when: never

apply:prod:
  extends: .apply_template
  variables:
    TF_ENV: "prod"
    AWS_ROLE_ARN: "${TF_APPLY_ROLE_ARN_PROD}"
  needs:
    - job: apply:shared
      optional: true
    - job: plan:prod
      artifacts: true
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'
      changes:
        - envs/prod/**/*
      when: manual
    - when: never

